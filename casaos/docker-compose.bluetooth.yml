# Variant with Bluetooth speakers. Install this OR docker-compose.yml, not both (same app id). Host requirements: docs/bluetooth-speakers.md in the repository.
name: shield-remote

services:
  shield-remote:
    image: ghcr.io/yukuhu/home-control:latest-bluetooth
    container_name: shield-remote
    network_mode: host
    restart: unless-stopped
    environment:
      HOME_CONTROL_BLUETOOTH_ENABLED: "true"
      PULSE_SERVER: unix:/run/pulse/native
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
      - type: bind
        source: /run/dbus
        target: /run/dbus
        read_only: true
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
      - type: bind
        source: /run/user/1000/pulse
        target: /run/pulse
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: Shield Remote web interface
      volumes:
        - container: /data
          description:
            en_US: Pairing credential and paired-device registry
        - container: /run/dbus
          description:
            en_US: Host D-Bus system bus, where BlueZ runs (read-only)
        - container: /etc/machine-id
          description:
            en_US: Host machine id, which the D-Bus client needs (read-only)
        - container: /run/pulse
          description:
            en_US: Host PipeWire or PulseAudio socket directory of the audio user

x-casaos:
  id: dev.andre.shield-remote
  main: shield-remote
  index: /
  port_map: "8080"
  scheme: http
  icon: https://raw.githubusercontent.com/Yukuhu/home-control/main/casaos/icon.svg
  title:
    en_US: Shield Remote
  category: Home
  tagline:
    en_US: A local web remote for NVIDIA Shield and Android TV
  description:
    en_US: Pair once through Remote v2 and control an NVIDIA Shield from any browser on the LAN.
  author: Yukuhu
  developer: Yukuhu
  architectures:
    - amd64
    - arm64
  version: "0.3.0"
  repo: https://github.com/Yukuhu/home-control
