[versions]
spring-boot = "4.1.1"
# Spring Boot 4.1.1 manages Tomcat 11.0.24, which has three critical vulnerabilities (CVE-2026-65182,
# CVE-2026-65905, CVE-2026-68525). Remove this once Spring Boot manages 11.0.25 or later.
tomcat = "11.0.26"
# Spring Boot 4.1.1 manages Jackson 3.1.5, which has three vulnerabilities (GHSA-q4xh-88c3-wmh7,
# GHSA-wjgm-6hv5-3cvf, GHSA-gx83-3vf8-gh7j). Remove this once Spring Boot manages 3.1.6 or later.
jackson = "3.1.7"
# The Spring Boot Gradle plugin puts commons-compress 1.27.1 on the build classpath, which brings
# commons-lang3 3.16.0 and its CVE-2025-48924 (GHSA-j288-q9x7-2f5v). The application never ships
# it, but the dependency graph reports it, so Dependabot alerts on it and then fails trying to
# update a version that no build file declares. Remove this once the plugin's commons-compress
# depends on commons-lang3 3.18.0 or later.
commons-lang3 = "3.20.0"
# protobuf-java and the protoc compiler must match: generated code targets its runtime.
protobuf = "4.36.2"
protobuf-plugin = "0.10.0"
sonarqube = "7.5.0.8588"
test-retry = "1.6.6"
jmdns = "3.6.3"
bouncycastle = "1.86"
bluez-dbus = "0.3.5"
dbus-java = "5.2.1"
# scripts/e2e.sh and the CI browser cache read this version.
playwright = "1.63.0"
archunit = "1.5.1"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bluez-dbus = { module = "com.github.hypfvieh:bluez-dbus", version.ref = "bluez-dbus" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-unixsocket = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus-java" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
test-retry = { id = "org.gradle.test-retry", version.ref = "test-retry" }
