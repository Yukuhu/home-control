# Reuses the outputs of tasks whose inputs have not changed, tests included. CI keeps the cache
# between runs (gradle/actions/setup-gradle), so a change to the docs or the workflow alone does
# not compile or test anything again.
org.gradle.caching=true
# Reuses the configured build when the build scripts and their inputs have not changed, so a
# repeated run skips configuration. A build script that keeps something the cache cannot store
# fails the build with a report under build/reports/configuration-cache.
org.gradle.configuration-cache=true
