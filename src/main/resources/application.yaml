server:
  port: 8080
  servlet:
    session:
      timeout: 30d
      tracking-modes: cookie
      cookie:
        name: HOME_CONTROL_SESSION
        http-only: true
        same-site: lax
        max-age: 30d
        secure: ${HOME_CONTROL_SECURE_COOKIE:false}

shield:
  data-dir: ./data
  keystore-password: ${SHIELD_KEYSTORE_PASSWORD:shield}
  discovery-enabled: true
  # The device pings roughly every 5s; 10s without any inbound message means dead.
  stale-timeout-seconds: 10
  reconnect-initial-delay-seconds: 1
  reconnect-max-delay-seconds: 60

home-control:
  ssdp:
    # One shared listener for smart TVs (and later DLNA/Sonos). Needs host networking.
    enabled: true
    multicast-address: 239.255.255.250
    port: 1900
    listen-port: 1900
    search-interval-seconds: 60
    mx: 2
  webos:
    enabled: true
    # SSAP over ws:// first, then wss:// (newer firmware) with the TV's self-signed certificate.
    port: 3000
    secure-port: 3001
    connect-timeout-seconds: 3
    request-timeout-seconds: 10
    # How long the setup page waits for someone to accept the prompt on the TV.
    pairing-timeout-seconds: 60
    reconnect-initial-delay-seconds: 1
    reconnect-max-delay-seconds: 30
    # After a Wake-on-LAN packet, how long the TV gets before the first reconnect.
    wake-grace-seconds: 3
  wake-on-lan:
    # Use the subnet broadcast (e.g. 192.168.1.255) if the host has several networks.
    broadcast-address: 255.255.255.255
    port: 9
  cast:
    enabled: true
    # A PING every 5 s; 15 s without any inbound frame means the receiver is gone.
    heartbeat-interval-seconds: 5
    stale-timeout-seconds: 15
    reconnect-initial-delay-seconds: 1
    reconnect-max-delay-seconds: 60
    command-timeout-seconds: 5
    load-timeout-seconds: 20
    media-status-interval-seconds: 5
  security:
    # Optional passphrase for secrets.json; without it a random /data/secret.key is created on first use.
    secret: ${HOME_CONTROL_SECRET:}
    # Extra origins allowed to POST, e.g. https://home.example.org when a proxy rewrites Host.
    trusted-origins: ${HOME_CONTROL_TRUSTED_ORIGINS:}
    # Extra host names (exact, or *.suffix) besides IP addresses, localhost, single-label and .local/.lan/.home.arpa/.internal names.
    allowed-hosts: ${HOME_CONTROL_ALLOWED_HOSTS:}
    login-attempts-per-address: 5
    login-attempts-total: 50
    login-window: 15m
  jellyfin:
    enabled: ${HOME_CONTROL_JELLYFIN_ENABLED:true}
    connect-timeout-seconds: 5
    request-timeout-seconds: 15
    rail-size: 20
  youtube:
    enabled: ${HOME_CONTROL_YOUTUBE_ENABLED:true}
    oauth-base-url: https://oauth2.googleapis.com
    api-base-url: https://www.googleapis.com/youtube/v3
    lounge-base-url: https://www.youtube.com/api/lounge
    thumbnail-base-url: https://i.ytimg.com
    connect-timeout-seconds: 5
    request-timeout-seconds: 15
    # Your Cloud project's daily YouTube Data API quota (10000 unless Google raised it).
    daily-quota-units: 10000
    # Each search costs 100 units.
    searches-per-day: 20
    rail-size: 30
    channels-per-refresh: 30
    videos-per-channel: 5
    subscriptions-refresh: 24h
    max-subscription-pages: 20
    refresh-interval: 60m
    min-refresh-spacing: 15m
    search-cache-ttl: 6h
  content:
    rails:
      # Background refresh; page loads never wait for it.
      scheduler-enabled: true
      tick: 15s
      retry-after-failure: 1m
      max-concurrent-fetches: 4
      # Per-source override of the source's default refresh interval, e.g. jellyfin: 10m
      refresh-intervals: {}
    search:
      # One deadline for every source; a source that misses it is reported as a failure, not held for.
      timeout: 8s
    # Defaults until changed on the setup page (TMDB watch region and deep-link domains use them).
    locale: ${HOME_CONTROL_LOCALE:de-DE}
    region: ${HOME_CONTROL_REGION:DE}
