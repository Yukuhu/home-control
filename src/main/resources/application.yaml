server:
  port: 8080
  servlet:
    session:
      timeout: 30d
      tracking-modes: cookie
      cookie:
        name: HOME_CONTROL_SESSION
        http-only: true
        same-site: lax
        max-age: 30d
        secure: ${HOME_CONTROL_SECURE_COOKIE:false}

spring:
  web:
    resources:
      cache:
        # Asset URLs are not versioned, so browsers must revalidate or they keep a pre-redeploy app.css.
        cachecontrol:
          no-cache: true

logging:
  level:
    # At DEBUG, HttpClient 5 logs request lines, headers and bodies, which carry API keys, tokens and form secrets.
    # Turning the whole application to DEBUG leaves it at INFO.
    org.apache.hc: info

home-control:
  data-dir: ./data
  discovery:
    enabled: true
  androidtv:
    enabled: true
    # Empty: generated with the keystore and kept encrypted in secrets.json. SHIELD_KEYSTORE_PASSWORD, the old
    # name, still sets it, from any source.
    keystore-password: ${SHIELD_KEYSTORE_PASSWORD:}
    # The device pings when idle; commands postpone pings. Count traffic in both directions.
    stale-timeout: 10s
    reconnect-initial-delay: 1s
    reconnect-max-delay: 60s
  ssdp:
    # One shared listener for smart TVs (and later DLNA/Sonos). Needs host networking.
    enabled: true
    multicast-address: 239.255.255.250
    port: 1900
    listen-port: 1900
    search-interval: 60s
    mx: 2
  webos:
    enabled: true
    # SSAP over ws:// first, then wss:// (newer firmware) with the TV's self-signed certificate.
    port: 3000
    secure-port: 3001
    connect-timeout: 3s
    request-timeout: 10s
    # How long the setup page waits for someone to accept the prompt on the TV.
    pairing-timeout: 60s
    reconnect-initial-delay: 1s
    reconnect-max-delay: 30s
    # After a Wake-on-LAN packet, how long the TV gets before the first reconnect.
    wake-grace: 3s
    # SSAP has no heartbeat: a connected TV is asked a cheap question this often; silence means it is gone.
    liveness-interval: 30s
  tizen:
    enabled: true
    # Remote-control WebSocket (TLS, self-signed), REST API and DIAL.
    port: 8002
    rest-port: 8001
    dial-port: 8080
    # What the TV shows in its Allow prompt and its list of connected devices.
    client-name: Home Control
    connect-timeout: 3s
    request-timeout: 5s
    pairing-timeout: 30s
    # Samsung pushes no state: power and the app in front are polled.
    poll-interval: 5s
    wake-grace: 3s
  upnp:
    # DLNA/UPnP media renderers found over SSDP (needs host networking).
    enabled: true
    # State is polled: every poll-interval while something plays, idle-poll-interval otherwise.
    poll-interval: 2s
    idle-poll-interval: 10s
    command-timeout: 5s
    connect-timeout: 3s
    reconnect-initial-delay: 1s
    reconnect-max-delay: 60s
  sonos:
    # Sonos rooms found over SSDP; grouping from the device drawer. Off: players appear as plain UPnP renderers.
    enabled: true
    poll-interval: 2s
    idle-poll-interval: 10s
    topology-interval: 30s
    command-timeout: 5s
    connect-timeout: 3s
    reconnect-initial-delay: 1s
    reconnect-max-delay: 60s
  bluetooth:
    # Bluetooth speakers through the host's BlueZ and a server-side mpv player.
    # Needs host plumbing and the -bluetooth image: see docs/user/bluetooth-speakers.md.
    enabled: false
    dbus-address: unix:path=/run/dbus/system_bus_socket
    # Blank = first powered adapter; otherwise an adapter MAC or id such as hci0.
    adapter: ""
    scan-duration: 10s
    bluez-timeout: 45s
    poll-interval: 5s
    playing-poll-interval: 1s
    auto-connect: true
    mpv-path: mpv
    # runtime-dir defaults to <java.io.tmpdir>/home-control-bluetooth
    # e.g. alsa/bluealsa:DEV={mac},PROFILE=a2dp - blank = find the speaker's PipeWire/PulseAudio sink.
    audio-device-template: ""
    default-volume: 50
    player-start-timeout: 5s
    load-timeout: 15s
    command-timeout: 3s
    host-check-cache-ttl: 30s
  events:
    # A comment line on every open event stream this often, so a reverse proxy does not close a quiet one.
    heartbeat-interval: 25s
  deep-link-test:
    # Blender Foundation's "Big Buck Bunny": long-lived and region-free.
    youtube-url: https://www.youtube.com/watch?v=aqz-KE-bpKQ
    timeout: 10s
  wake-on-lan:
    # Use the subnet broadcast (e.g. 192.168.1.255) if the host has several networks.
    broadcast-address: 255.255.255.255
    port: 9
  cast:
    enabled: true
    # A PING every 5 s; 15 s without any inbound frame means the receiver is gone.
    heartbeat-interval: 5s
    stale-timeout: 15s
    reconnect-initial-delay: 1s
    reconnect-max-delay: 60s
    command-timeout: 5s
    load-timeout: 20s
    media-status-interval: 5s
  security:
    # Optional passphrase for secrets.json; without it a random /data/secret.key is created on first use.
    secret: ${HOME_CONTROL_SECRET:}
    # Extra origins allowed to POST, e.g. https://home.example.org when a proxy rewrites Host.
    trusted-origins: ${HOME_CONTROL_TRUSTED_ORIGINS:}
    # Extra host names (exact, or *.suffix) besides IP addresses, localhost, single-label and .local/.lan/.home.arpa/.internal names.
    allowed-hosts: ${HOME_CONTROL_ALLOWED_HOSTS:}
    login-attempts-per-address: 5
    login-attempts-total: 50
    login-window: 15m
    # A forgotten login password: true removes it, and the content sources' credentials, at startup. TV pairings stay.
    reset-login: ${HOME_CONTROL_RESET_LOGIN:false}
  workflows:
    enabled: ${HOME_CONTROL_WORKFLOWS_ENABLED:true}
    allow-loopback: ${HOME_CONTROL_WORKFLOWS_ALLOW_LOOPBACK:false}
  jellyfin:
    enabled: ${HOME_CONTROL_JELLYFIN_ENABLED:true}
    connect-timeout: 5s
    request-timeout: 15s
    startup-timeout: 30s
    rail-size: 20
  tmdb:
    enabled: true
    api-base-url: https://api.themoviedb.org/3
    # Leave empty to use TMDB's /configuration; set to serve posters from a mirror.
    image-base-url:
    connect-timeout: 5s
    request-timeout: 10s
    rail-size: 20
    trending-candidates: 40
    provider-cache-ttl: 24h
    configuration-cache-ttl: 24h
    # TMDB is a public API: an answer that points at this machine is refused unless a local mirror is meant.
    allow-loopback: false
    provider-ids:
      netflix: [8, 1796]
      primevideo: [9, 119, 2100]
  pinned:
    enabled: true
    max-pins: 200
  sports:
    enabled: true
    # Blank: the time zone chosen in Setup, else the container's TZ.
    time-zone: ""
    rail-size: 30
    max-calendars: 10
    max-competitions: 10
    default-event-duration: 120m
    calendar:
      refresh: 6h
      connect-timeout: 5s
      request-timeout: 15s
      max-bytes: 5242880
      max-redirects: 3
      # Loopback addresses reach this box's own services; allow only if the calendar is served here.
      allow-loopback: false
    thesportsdb:
      enabled: true
      api-base-url: https://www.thesportsdb.com/api/v1/json
      # TheSportsDB's documented free key; a personal key is entered in Setup and stored as a secret.
      free-key: "123"
      fixtures-ttl: 24h
      connect-timeout: 5s
      request-timeout: 15s
      # TheSportsDB is a public API: an answer that points at this machine is refused unless a local mirror is meant.
      allow-loopback: false
      sport-durations:
        soccer: 120m
        basketball: 150m
        americanfootball: 210m
        icehockey: 165m
        handball: 105m
        rugby: 120m
        tennis: 180m
        motorsport: 150m
        darts: 240m
  youtube:
    enabled: ${HOME_CONTROL_YOUTUBE_ENABLED:true}
    oauth-base-url: https://oauth2.googleapis.com
    api-base-url: https://www.googleapis.com/youtube/v3
    lounge-base-url: https://www.youtube.com/api/lounge
    thumbnail-base-url: https://i.ytimg.com
    # Google's APIs are public: an answer that points at this machine is refused unless a local mirror is meant.
    allow-loopback: false
    connect-timeout: 5s
    request-timeout: 15s
    # Your Cloud project's daily YouTube Data API quota (10000 unless Google raised it).
    daily-quota-units: 10000
    # Each search costs 100 units.
    searches-per-day: 20
    rail-size: 30
    channels-per-refresh: 30
    videos-per-channel: 5
    subscriptions-refresh: 24h
    max-subscription-pages: 20
    refresh-interval: 60m
    min-refresh-spacing: 15m
    search-cache-ttl: 6h
  content:
    rails:
      # Background refresh; page loads never wait for it.
      scheduler-enabled: true
      tick: 15s
      retry-after-failure: 1m
      max-concurrent-fetches: 4
      # Per-source override of the source's default refresh interval, e.g. jellyfin: 10m
      refresh-intervals: {}
    search:
      # One deadline for every source; a source that misses it is reported as a failure, not held for.
      timeout: 8s
    # Defaults until changed on the setup page (TMDB watch region and deep-link domains use them).
    locale: ${HOME_CONTROL_LOCALE:de-DE}
    region: ${HOME_CONTROL_REGION:DE}
