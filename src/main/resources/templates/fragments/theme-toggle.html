<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- js/theme.js keeps aria-pressed in step with the saved theme and switches it on click. -->

        title="Switch between the default and Cyberpunk themes"><svg class="control-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 6h8l2 2v8l-2 2H8l-2-2V8Z"/><path d="M10 10h4v4h-4ZM9 6V3m6 3V3M9 21v-3m6 3v-3M6 9H3m3 6H3m18-6h-3m3 6h-3"/></svg><span class="theme-toggle-label">Cyberpunk<span class="visually-hidden"> theme</span></span></button>

</body>
</html>
