<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14161a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Home">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Home Control · Log in</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<main class="setup">
    <h1>Log in</h1>
    <p class="error" th:if="${error}" th:text="${error}">Wrong password</p>
    <form method="post" th:action="@{/login}">
        <input type="hidden" name="next" th:value="${next}">
        <input type="password" name="password" autocomplete="current-password" autofocus required>
        <button type="submit">Log in</button>
    </form>
    <p class="hint">
        Forgot the password? Stop Home Control and delete secrets.json in its data folder, then reconnect your
        content sources.
    </p>
</main>
</body>
</html>
