server:
  port: 8080
  servlet:
    session:
      timeout: 30d
      tracking-modes: cookie
      cookie:
        name: HOME_CONTROL_SESSION
        http-only: true
        same-site: lax
        max-age: 30d
        secure: false

spring:
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

shield:
  data-dir: build/test-data
  keystore-password: shield
  discovery-enabled: false
  stale-timeout-seconds: 10
  reconnect-initial-delay-seconds: 1
  reconnect-max-delay-seconds: 60

home-control:
  ssdp:
    enabled: false
  upnp:
    enabled: true
  sonos:
    enabled: true
  bluetooth:
    enabled: false
  cast:
    enabled: true
    # A PING every 5 s; 15 s without any inbound frame means the receiver is gone.
    heartbeat-interval-seconds: 5
    stale-timeout-seconds: 15
    reconnect-initial-delay-seconds: 1
    reconnect-max-delay-seconds: 60
    command-timeout-seconds: 5
    load-timeout-seconds: 20
    media-status-interval-seconds: 5
  security:
    secret: ""
    trusted-origins: ""
    allowed-hosts: ""
    login-attempts-per-address: 5
    login-attempts-total: 50
    login-window: 15m
  workflows:
    enabled: ${HOME_CONTROL_WORKFLOWS_ENABLED:true}
    allow-loopback: ${HOME_CONTROL_WORKFLOWS_ALLOW_LOOPBACK:false}
  jellyfin:
    enabled: true
    connect-timeout-seconds: 5
    request-timeout-seconds: 15
    rail-size: 20
  tmdb:
    enabled: true
    api-base-url: http://127.0.0.1:9/3
    image-base-url:
    connect-timeout-seconds: 1
    request-timeout-seconds: 2
    rail-size: 20
    trending-candidates: 40
    provider-cache-ttl: 24h
    configuration-cache-ttl: 24h
    provider-ids:
      netflix: [8, 1796]
      primevideo: [9, 119, 2100]
  pinned:
    enabled: true
    max-pins: 200
  sports:
    enabled: true
    time-zone: ""
    rail-size: 30
    max-calendars: 10
    max-competitions: 10
    default-event-duration: 120m
    calendar:
      refresh: 6h
      connect-timeout-seconds: 1
      request-timeout-seconds: 2
      max-bytes: 5242880
      max-redirects: 3
      allow-loopback: false
    thesportsdb:
      enabled: true
      api-base-url: http://127.0.0.1:9/api/v1/json
      free-key: "123"
      fixtures-ttl: 24h
      connect-timeout-seconds: 1
      request-timeout-seconds: 2
      sport-durations:
        soccer: 120m
        basketball: 150m
        americanfootball: 210m
        icehockey: 165m
        handball: 105m
        rugby: 120m
        tennis: 180m
        motorsport: 150m
        darts: 240m
  youtube:
    enabled: true
    oauth-base-url: http://127.0.0.1:9
    api-base-url: http://127.0.0.1:9
    lounge-base-url: http://127.0.0.1:9
    thumbnail-base-url: http://127.0.0.1:9
    connect-timeout-seconds: 5
    request-timeout-seconds: 15
    daily-quota-units: 10000
    searches-per-day: 20
    rail-size: 30
    channels-per-refresh: 30
    videos-per-channel: 5
    subscriptions-refresh: 24h
    max-subscription-pages: 20
    refresh-interval: 60m
    min-refresh-spacing: 15m
    search-cache-ttl: 6h
  content:
    rails:
      scheduler-enabled: false
      tick: 15s
      retry-after-failure: 1m
      max-concurrent-fetches: 4
      refresh-intervals: {}
    search:
      timeout: 2s
    locale: de-DE
    region: DE
