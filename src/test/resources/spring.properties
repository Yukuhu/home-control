# Cached test contexts keep running between test classes. Spring Framework 7 otherwise pauses a cached context when
# the next test class uses another one (it stops the context's Lifecycle beans) and restarts it when a later class
# reuses it. RailCache shuts its fetch executor down in stop() and cannot start it again, so the shared FullAppTest
# context would load no rail after its first pause. The application itself only stops to close.
spring.test.context.cache.pause = never
