# Test overrides only. Spring Boot loads src/main/resources/application.yaml as in production and this file
# (classpath:/config/ wins over classpath:/) on top of it, so tests bind the real configuration and change only
# what a test run must not do: discover the LAN, reach real upstream APIs, wait out production timeouts, refresh
# rails on a schedule, or share files with another test JVM.
home-control:
  # One directory per test JVM: Gradle sets org.gradle.test.worker in each, and outside Gradle it is 0.
  data-dir: build/test-data/${org.gradle.test.worker:0}
  discovery:
    enabled: false
  bluetooth:
    # mpv's socket directory, one per test JVM. It stays under java.io.tmpdir: a Unix socket path must be short.
    runtime-dir: ${java.io.tmpdir}/home-control-bluetooth-${org.gradle.test.worker:0}
  ssdp:
    enabled: false
  security:
    # Pinned so a shell that exports HOME_CONTROL_SECRET/_TRUSTED_ORIGINS for an IDE run never leaks into tests.
    secret: ""
    trusted-origins: ""
    allowed-hosts: ""
  tmdb:
    api-base-url: http://127.0.0.1:9/3
    connect-timeout: 1s
    request-timeout: 2s
  sports:
    calendar:
      connect-timeout: 1s
      request-timeout: 2s
    thesportsdb:
      api-base-url: http://127.0.0.1:9/api/v1/json
      connect-timeout: 1s
      request-timeout: 2s
  youtube:
    oauth-base-url: http://127.0.0.1:9
    api-base-url: http://127.0.0.1:9
    lounge-base-url: http://127.0.0.1:9
    thumbnail-base-url: http://127.0.0.1:9
  content:
    rails:
      scheduler-enabled: false
    search:
      timeout: 2s
