services:
  shield-remote:
    build: .
    # Or skip building and pull the multi-arch image CI publishes (amd64/arm64)
    # by commenting out `build` above and using:
    # image: ghcr.io/yukuhu/home-control:latest
    # Host networking is REQUIRED for mDNS and SSDP discovery and for Wake-on-LAN
    # broadcasts: multicast and broadcasts do not cross a bridge network. On bridge
    # networking the app still works, but devices must be added by address on the
    # setup page and smart TVs may not switch on.
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      SHIELD_KEYSTORE_PASSWORD: change-me
      # The app listens on 8080 by default. Spring Boot reads SERVER_PORT, so
      # uncommenting this is all that is needed under host networking:
      # SERVER_PORT: 9090
    restart: unless-stopped

# Bridge-mode alternative (no discovery, manual address entry only):
#
#  shield-remote:
#    build: .
#    ports:
#      - "8080:8080"
#    volumes:
#      - ./data:/data
