name: Browser tests
description: Runs the Playwright browser tests in one browser and uploads their report and results.

inputs:
  browser:
    description: The browser to test in, chromium, firefox or webkit.
    required: true
  coverage:
    description: Whether to record which JavaScript ran. Only Chromium can.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: '25'

    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

    # Browser binaries are version-pinned by gradle/libs.versions.toml; OS packages are re-installed every
    # run by --with-deps (fast when already present) because the runner image is fresh.
    - name: Cache the Playwright browser
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browser }}-${{ hashFiles('gradle/libs.versions.toml') }}

    - name: Install the browser
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: ./gradlew installPlaywrightBrowsers "-Pe2eBrowsers=$BROWSER"

    - name: Run the browser tests
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        COVERAGE: ${{ inputs.coverage }}
      run: ./gradlew e2eTest "-Pe2eBrowsers=$BROWSER" "-Pe2eCoverage=$COVERAGE"

    - name: Upload the browser test report and traces
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: e2e-report-${{ inputs.browser }}
        path: |
          build/reports/tests/e2eTest
          build/e2e-artifacts
        if-no-files-found: ignore

    - name: Upload the test results for the pull request summary
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: junit-e2e-${{ inputs.browser }}
        path: build/test-results/e2eTest/TEST-*.xml
        if-no-files-found: ignore
