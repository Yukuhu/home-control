name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; an in-flight publish on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud needs the base history to identify changed lines in PRs.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Also validates the Gradle wrapper checksums, which is on by default.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and run the full suite
        run: ./gradlew build

      - name: Analyze with SonarCloud and require a passing quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN is unavailable; the SonarCloud quality gate cannot be verified."
            exit 1
          fi
          ./gradlew sonar -Dsonar.qualitygate.wait=true

      # Java bytecode is architecture-independent, so this one jar serves both
      # platforms the publish job builds for.
      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  image:
    name: Build the self-contained image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Proves `docker compose up --build` works from a clean checkout, and keeps
      # this Dockerfile's runtime stage from drifting away from Dockerfile.dist.
      # amd64 only: this job is a correctness check, not a release artifact.
      - name: Build Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The -bluetooth variant installs mpv; prove that build too (amd64 only, not pushed).
      - name: Build Dockerfile with mpv
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: WITH_MPV=true
          cache-from: type=gha,scope=bluetooth
          cache-to: type=gha,mode=max,scope=bluetooth

  e2e:
    name: Browser tests (Chromium, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # Browser binaries are version-pinned by build.gradle.kts; OS packages are re-installed every
      # run by --with-deps (fast when already present) because the runner image is fresh.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      - name: Install Chromium and WebKit
        run: ./gradlew installPlaywrightBrowsers

      - name: Run the browser tests
        run: ./gradlew e2eTest

      - name: Upload the browser test report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            build/reports/tests/e2eTest
            build/e2e-artifacts
          if-no-files-found: ignore

  release:
    name: Release
    # Conventional commits decide whether there is anything to release at all:
    # feat -> minor, fix/perf -> patch, breaking -> minor while still pre-1.0.
    # A push of only docs/ci/chore/test/refactor commits releases nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Version computation reads the whole history and every existing tag.
          fetch-depth: 0

      - name: Work out the next version
        id: version
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: conventionalcommits
          # Compute only. This job creates the tag and release itself, further
          # down, so that the image is published in the same run.
          skip-commit: true
          skip-tag: true
          skip-on-empty: true
          output-file: false

      # Below 1.0 a breaking change bumps the minor; it must not promote the
      # project to 1.0.0. Fail loudly rather than cut a release nobody intended.
      - name: Check the pre-1.0 rule held
        if: steps.version.outputs.skipped == 'false'
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          next="${{ steps.version.outputs.version }}"
          if [[ "$previous" == v0.* && "$next" != 0.* ]]; then
            echo "::error::Refusing to promote $previous to $next. This project stays pre-1.0:"
            echo "::error::a breaking change should bump the minor. Adjust deliberately if 1.0 is intended."
            exit 1
          fi
          echo "$previous -> $next"
          echo "majorminor=$(echo "$next" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
        id: guard

      - uses: actions/setup-java@v6
        if: steps.version.outputs.skipped == 'false'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.skipped == 'false'

      # Rebuilt here rather than reused from the test job, because the version is
      # only known once the commits have been analysed.
      - name: Build the release jar
        if: steps.version.outputs.skipped == 'false'
        run: ./gradlew bootJar -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Assemble the dist build context
        if: steps.version.outputs.skipped == 'false'
        run: mkdir -p dist && cp Dockerfile.dist dist/Dockerfile && cp build/libs/*.jar dist/

      - uses: docker/setup-qemu-action@v4
        if: steps.version.outputs.skipped == 'false'
      - uses: docker/setup-buildx-action@v4
        if: steps.version.outputs.skipped == 'false'

      - uses: docker/login-action@v4
        if: steps.version.outputs.skipped == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.version.outputs.skipped == 'false'
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the image name, which GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.guard.outputs.majorminor }}
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        if: steps.version.outputs.skipped == 'false'
        uses: docker/build-push-action@v7
        with:
          context: dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag and release before the multi-arch -bluetooth image below, so a slow or failed
      # build of that optional variant never blocks or gates the release itself.
      - name: Tag and release
        if: steps.version.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          # Passed as an environment variable rather than interpolated into the
          # script: commit messages are untrusted input, and a stray quote would
          # otherwise break the shell or worse.
          CHANGELOG: ${{ steps.version.outputs.clean_changelog }}
        run: |
          printf '%s\n' "$CHANGELOG" > notes.md
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md

      - id: meta-bluetooth
        if: steps.version.outputs.skipped == 'false'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-bluetooth
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.guard.outputs.majorminor }}
            type=raw,value=latest

      # Same jar, plus mpv for Bluetooth speakers (docs/bluetooth-speakers.md). Runs after the
      # release is tagged and pushed: this multi-arch build is slow and optional, and must never
      # gate or delay the release itself. continue-on-error so a failure here is visible in the
      # job summary without failing the whole workflow.
      - name: Build and push the Bluetooth variant
        if: steps.version.outputs.skipped == 'false'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: dist
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: WITH_MPV=true
          tags: ${{ steps.meta-bluetooth.outputs.tags }}
          labels: ${{ steps.meta-bluetooth.outputs.labels }}
          cache-from: type=gha,scope=bluetooth
          cache-to: type=gha,mode=max,scope=bluetooth

      - name: Report
        run: |
          if [ "${{ steps.version.outputs.skipped }}" = "true" ]; then
            echo "No releasable commits since the last tag - nothing published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
