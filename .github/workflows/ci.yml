name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; an in-flight publish on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarCloud needs the base history to identify changed lines in PRs.
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      # Also validates the Gradle wrapper checksums, which is on by default.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build and run the full suite
        run: ./gradlew build

      - name: Upload Java analysis reports for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: java-analysis
          path: |
            build/reports/jacoco/test/jacocoTestReport.xml
            build/test-results/test/TEST-*.xml
          if-no-files-found: error

      # Java bytecode is architecture-independent, so this one jar serves both
      # platforms the publish job builds for.
      - name: Upload the jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report
          path: build/reports/tests/test

      # Uploaded even when tests fail, which is when the pull request summary needs them most.
      - name: Upload the test results for the pull request summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-test
          path: build/test-results/test/TEST-*.xml
          if-no-files-found: ignore

  image:
    name: Build the self-contained image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Proves `docker compose up --build` works from a clean checkout, and keeps
      # this Dockerfile's runtime stage from drifting away from Dockerfile.dist.
      # amd64 only: this job is a correctness check, not a release artifact.
      - name: Build Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The -bluetooth variant installs mpv; prove that build too (amd64 only, not pushed).
      - name: Build Dockerfile with mpv
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: WITH_MPV=true
          cache-from: type=gha,scope=bluetooth
          cache-to: type=gha,mode=max,scope=bluetooth

  image-arm64:
    name: Smoke-test the image on arm64
    # The release job cross-builds the arm64 image under QEMU and never starts it. This native
    # arm64 runner (free for public repositories) builds the self-contained Dockerfile, whose
    # runtime stage matches Dockerfile.dist, and actually runs it, so arm64-only breakage fails
    # here instead of on someone's Raspberry Pi.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Own cache scopes: a gha scope holds one cache per writer, and amd64 must not evict these.
      - name: Build Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: home-control:smoke
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Run the image
        run: scripts/smoke-test-image.sh home-control:smoke

  image-arm64-bluetooth:
    name: Smoke-test the Bluetooth image on arm64
    # The same for the -bluetooth variant, as its own job so the release does not wait for it:
    # like the variant's publish step, it must never gate the release. A failure still shows here.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Dockerfile with mpv
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: home-control:smoke-bluetooth
          build-args: WITH_MPV=true
          cache-from: type=gha,scope=arm64-bluetooth
          cache-to: type=gha,mode=max,scope=arm64-bluetooth

      - name: Run the image with mpv
        run: scripts/smoke-test-image.sh --bluetooth home-control:smoke-bluetooth

  e2e:
    name: Browser tests (Chromium, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Browser binaries are version-pinned by gradle/libs.versions.toml; OS packages are re-installed every
      # run by --with-deps (fast when already present) because the runner image is fresh.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install Chromium and WebKit
        run: ./gradlew installPlaywrightBrowsers

      - name: Run the browser tests
        run: ./gradlew e2eTest -Pe2eCoverage=true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/browser-coverage/package-lock.json

      - name: Convert browser execution coverage to LCOV
        working-directory: scripts/browser-coverage
        run: |
          npm ci --ignore-scripts
          npm test
          npm run report

      - name: Upload JavaScript coverage for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-coverage
          path: build/reports/browser-coverage/lcov.info
          if-no-files-found: error

      - name: Upload the browser test report and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-report
          path: |
            build/reports/tests/e2eTest
            build/e2e-artifacts
          if-no-files-found: ignore

      - name: Upload the test results for the pull request summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-e2e
          path: build/test-results/e2eTest/TEST-*.xml
          if-no-files-found: ignore

  sonar:
    name: SonarCloud quality gate
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-analysis
          path: build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-coverage
          path: build/reports/browser-coverage

      - name: Analyze both test suites and gate pull requests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          REQUIRE_SONAR_QUALITY_GATE: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN is unavailable; the SonarCloud quality gate cannot be verified."
            exit 1
          fi
          ./gradlew classes testClasses sonar -x test -x jacocoTestReport \
            "-Dsonar.qualitygate.wait=$REQUIRE_SONAR_QUALITY_GATE"

  pr-summary:
    name: Summarise the run on the pull request
    # One comment per pull request, replaced on every run. Runs when earlier jobs failed, which
    # is when it matters, but not when the run was cancelled. Fork pull requests get a read-only
    # token, so they are left out.
    needs: [test, e2e, image, image-arm64, image-arm64-bluetooth, sonar]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read this run's start time and the links to its jobs.
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/pr-summary/package-lock.json

      # Either artifact is missing when its job failed before running any test.
      - name: Download the unit and integration results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-test
          path: junit/test

      - name: Download the browser test results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-e2e
          path: junit/e2e

      # The only step here that may fail the job: a broken summary script should fail the
      # pull request that broke it. Everything after it reports problems as warnings.
      - name: Test the summary script
        working-directory: scripts/pr-summary
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Write the summary
        id: summary
        continue-on-error: true
        working-directory: scripts/pr-summary
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as environment variables rather than interpolated into the script.
          NEEDS_JSON: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Yukuhu_home-control
          JUNIT_TEST_DIR: ${{ github.workspace }}/junit/test
          JUNIT_E2E_DIR: ${{ github.workspace }}/junit/e2e
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Without these the summary only loses its duration and its links to job logs.
          RUN_STARTED_AT=$(gh api "$run" --jq .run_started_at) || RUN_STARTED_AT=
          JOBS_JSON=$(gh api "$run/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | {name, html_url}]') || JOBS_JSON='[]'
          export RUN_STARTED_AT JOBS_JSON
          if ! npm run --silent summary; then
            echo "::warning::The pull request summary could not be written."
            exit 1
          fi

      # Delete before posting: if posting fails, the pull request has no summary rather than
      # two. Only this workflow's own comments are deleted, so pasting the marker into a
      # comment does not get that comment removed.
      - name: Replace the comment on the pull request
        if: steps.summary.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          set -euo pipefail
          trap 'echo "::warning::The pull request summary could not be posted."' ERR
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          gh api --paginate "$comments?per_page=100" --jq '.[]
            | select(.user.login == "github-actions[bot]")
            | select(.body | startswith("<!-- home-control-ci-summary -->"))
            | .id' > "$RUNNER_TEMP/previous-summaries"
          while read -r id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done < "$RUNNER_TEMP/previous-summaries"
          gh api --method POST "$comments" -F "body=@$SUMMARY_FILE" --silent

  release:
    name: Release
    # Conventional commits decide whether there is anything to release at all:
    # feat -> minor, fix/perf -> patch, breaking -> minor while still pre-1.0.
    # A push of only docs/ci/chore/test/refactor commits releases nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image, image-arm64, e2e, sonar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Version computation reads the whole history and every existing tag.
          fetch-depth: 0

      - name: Work out the next version
        id: version
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          preset: conventionalcommits
          # Compute only. This job creates the tag and release itself, further
          # down, so that the image is published in the same run.
          skip-commit: true
          skip-tag: true
          skip-on-empty: true
          output-file: false

      # Below 1.0 a breaking change bumps the minor; it must not promote the
      # project to 1.0.0. Fail loudly rather than cut a release nobody intended.
      - name: Check the pre-1.0 rule held
        if: steps.version.outputs.skipped == 'false'
        run: |
          previous=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          next="${{ steps.version.outputs.version }}"
          if [[ "$previous" == v0.* && "$next" != 0.* ]]; then
            echo "::error::Refusing to promote $previous to $next. This project stays pre-1.0:"
            echo "::error::a breaking change should bump the minor. Adjust deliberately if 1.0 is intended."
            exit 1
          fi
          echo "$previous -> $next"
          echo "majorminor=$(echo "$next" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
        id: guard

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: steps.version.outputs.skipped == 'false'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        if: steps.version.outputs.skipped == 'false'

      # Rebuilt here rather than reused from the test job, because the version is
      # only known once the commits have been analysed.
      - name: Build the release jar
        if: steps.version.outputs.skipped == 'false'
        run: ./gradlew bootJar -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Assemble the dist build context
        if: steps.version.outputs.skipped == 'false'
        run: mkdir -p dist && cp Dockerfile.dist dist/Dockerfile && cp build/libs/*.jar dist/

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: steps.version.outputs.skipped == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.version.outputs.skipped == 'false'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: steps.version.outputs.skipped == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.version.outputs.skipped == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # metadata-action lowercases the image name, which GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.guard.outputs.majorminor }}
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        if: steps.version.outputs.skipped == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag and release before the multi-arch -bluetooth image below, so a slow or failed
      # build of that optional variant never blocks or gates the release itself.
      - name: Tag and release
        if: steps.version.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          # Passed as an environment variable rather than interpolated into the
          # script: commit messages are untrusted input, and a stray quote would
          # otherwise break the shell or worse.
          CHANGELOG: ${{ steps.version.outputs.clean_changelog }}
        run: |
          printf '%s\n' "$CHANGELOG" > notes.md
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md

      - id: meta-bluetooth
        if: steps.version.outputs.skipped == 'false'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-bluetooth
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.guard.outputs.majorminor }}
            type=raw,value=latest

      # Same jar, plus mpv for Bluetooth speakers (docs/bluetooth-speakers.md). Runs after the
      # release is tagged and pushed: this multi-arch build is slow and optional, and must never
      # gate or delay the release itself. continue-on-error so a failure here is visible in the
      # job summary without failing the whole workflow.
      - name: Build and push the Bluetooth variant
        if: steps.version.outputs.skipped == 'false'
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: dist
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: WITH_MPV=true
          tags: ${{ steps.meta-bluetooth.outputs.tags }}
          labels: ${{ steps.meta-bluetooth.outputs.labels }}
          cache-from: type=gha,scope=bluetooth
          cache-to: type=gha,mode=max,scope=bluetooth

      - name: Report
        run: |
          if [ "${{ steps.version.outputs.skipped }}" = "true" ]; then
            echo "No releasable commits since the last tag - nothing published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Released ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
