name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes are worth cancelling; an in-flight publish on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jar:
    name: Build the jar
    # The one jar of this run: the images that are tested and the images that are published are
    # all built from it. It carries its version, so the version is worked out here, first.
    runs-on: ubuntu-latest
    # Every job has a limit a few times its usual duration: a build that hangs fails in minutes
    # rather than holding the run for the six hours GitHub allows.
    timeout-minutes: 10
    outputs:
      # 'true' on a push to main with commits to release. Pull requests never release.
      release: ${{ steps.plan.outputs.release }}
      # The next three are empty unless `release` is 'true'.
      version: ${{ steps.plan.outputs.version }}
      majorminor: ${{ steps.plan.outputs.majorminor }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Version computation reads the whole history and every existing tag.
          fetch-depth: 0
          # Nothing here pushes, and the build below runs third-party code.
          persist-credentials: false

      # Conventional commits decide whether there is anything to release at all:
      # feat -> minor, fix/perf -> patch, breaking -> minor while still pre-1.0.
      # A push of only docs/ci/chore/test/refactor commits releases nothing.
      # On a pull request this is a rehearsal: it says what merging would release.
      - name: Work out the next version
        id: version
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          github-token: ${{ github.token }}
          preset: conventionalcommits
          # Compute only. The release job creates the tag and the release itself, once the
          # image is published. This job's token could not push anyway.
          skip-commit: true
          skip-tag: true
          git-push: false
          # The checkout is the commit that is tested; pulling could move past it.
          skip-git-pull: true
          skip-on-empty: true
          output-file: false

      # Below 1.0 a breaking change bumps the minor; it must not promote the
      # project to 1.0.0. Fail loudly rather than cut a release nobody intended.
      - name: Check the pre-1.0 rule held and decide whether to release
        id: plan
        env:
          SKIPPED: ${{ steps.version.outputs.skipped }}
          NEXT: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # The action above wrote its token into the address of the remote. Nothing after this
          # needs it, and the build below runs third-party code.
          git remote set-url origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          if [[ "$SKIPPED" != false ]]; then
            echo "No releasable commits since the last tag: nothing will be published." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          if [[ "$previous" == v0.* && "$NEXT" != 0.* ]]; then
            echo "::error::Refusing to promote $previous to $NEXT. This project stays pre-1.0:"
            echo "::error::a breaking change should bump the minor. Adjust deliberately if 1.0 is intended."
            exit 1
          fi
          echo "$previous -> $NEXT"
          if [[ "$ON_MAIN" != true ]]; then
            echo "Merging this would release $TAG (now $previous)." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing $TAG (was $previous)." >> "$GITHUB_STEP_SUMMARY"
          {
            echo "release=true"
            echo "version=$NEXT"
            echo "majorminor=$(echo "$NEXT" | cut -d. -f1,2)"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      # Also validates the Gradle wrapper checksums, which is on by default.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build the jar
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: ./gradlew bootJar ${VERSION:+"-PreleaseVersion=$VERSION"}

      # Java bytecode is architecture-independent, so this one jar serves both
      # platforms the images are built for.
      - name: Upload the jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Write the release notes
        if: steps.plan.outputs.release == 'true'
        env:
          # Passed as an environment variable rather than interpolated into the
          # script: commit messages are untrusted input, and a stray quote would
          # otherwise break the shell or worse.
          CHANGELOG: ${{ steps.version.outputs.clean_changelog }}
        run: printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/notes.md"

      - name: Upload the release notes
        if: steps.plan.outputs.release == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarCloud needs the base history to identify changed lines in PRs.
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      # Also validates the Gradle wrapper checksums, which is on by default.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build and run the full suite
        run: ./gradlew build

      - name: Upload Java analysis reports for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: java-analysis
          path: |
            build/reports/jacoco/test/jacocoTestReport.xml
            build/test-results/test/TEST-*.xml
          if-no-files-found: error

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report
          path: build/reports/tests/test

      # Uploaded even when tests fail, which is when the pull request summary needs them most.
      - name: Upload the test results for the pull request summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-test
          path: build/test-results/test/TEST-*.xml
          if-no-files-found: ignore

  image:
    name: Build the self-contained image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The images CI tests and publishes are built from Dockerfile.dist. What they run is only
      # what a build from source runs if the two files agree on everything after the build.
      - name: Check that both Dockerfiles describe the same runtime
        run: scripts/compare-dockerfiles.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Proves `docker compose up --build` works from a clean checkout. amd64 only: this job
      # is a correctness check, not a release artifact. Without a cache, which could hold
      # nothing of use: the build stage copies the whole checkout, so every commit rebuilds it.
      - name: Build Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false

  smoke:
    name: Smoke-test the image on ${{ matrix.arch }}
    # Builds the image that is published, natively on each architecture it is published for
    # (the arm64 runner is free for public repositories), and actually runs it, so that
    # arm64-only breakage fails here instead of on someone's Raspberry Pi. For a release, the
    # image that ran is the image that is published: see .github/actions/smoke-image.
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      # To push the tested image by digest, which only a release does.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/smoke-image
        with:
          arch: ${{ matrix.arch }}
          version: ${{ needs.jar.outputs.version }}
          token: ${{ github.token }}

  smoke-bluetooth:
    name: Smoke-test the Bluetooth image on ${{ matrix.arch }}
    # The same for the -bluetooth variant, as its own job so the release does not wait for it:
    # the variant must never gate the release. A failure still shows here, and keeps a variant
    # that does not start from being published.
    needs: jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      # To push the tested image by digest, which only a release does.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/smoke-image
        with:
          arch: ${{ matrix.arch }}
          bluetooth: true
          version: ${{ needs.jar.outputs.version }}
          token: ${{ github.token }}

  e2e:
    name: Browser tests (Chromium, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Browser binaries are version-pinned by gradle/libs.versions.toml; OS packages are re-installed every
      # run by --with-deps (fast when already present) because the runner image is fresh.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Install Chromium and WebKit
        run: ./gradlew installPlaywrightBrowsers

      - name: Run the browser tests
        run: ./gradlew e2eTest -Pe2eCoverage=true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/browser-coverage/package-lock.json

      - name: Convert browser execution coverage to LCOV
        working-directory: scripts/browser-coverage
        run: |
          npm ci --ignore-scripts
          npm test
          npm run report

      - name: Upload JavaScript coverage for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-coverage
          path: build/reports/browser-coverage/lcov.info
          if-no-files-found: error

      # The pull request summary's script is JavaScript that SonarCloud analyses too. Its tests
      # run here because this job already has Node; the summary job itself runs after the scan.
      - name: Test the pull request summary script with coverage
        working-directory: scripts/pr-summary
        run: |
          npm ci --ignore-scripts
          npm run coverage

      - name: Upload the summary script's coverage for SonarCloud
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-summary-coverage
          path: build/reports/pr-summary/lcov.info
          if-no-files-found: error

      - name: Upload the browser test report and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-report
          path: |
            build/reports/tests/e2eTest
            build/e2e-artifacts
          if-no-files-found: ignore

      - name: Upload the test results for the pull request summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: junit-e2e
          path: build/test-results/e2eTest/TEST-*.xml
          if-no-files-found: ignore

  sonar:
    name: SonarCloud quality gate
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: java-analysis
          path: build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-coverage
          path: build/reports/browser-coverage

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-summary-coverage
          path: build/reports/pr-summary

      - name: Analyze both test suites and gate pull requests
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          REQUIRE_SONAR_QUALITY_GATE: ${{ github.event_name == 'pull_request' }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_TOKEN is unavailable; the SonarCloud quality gate cannot be verified."
            exit 1
          fi
          ./gradlew classes testClasses sonar -x test -x jacocoTestReport \
            "-Dsonar.qualitygate.wait=$REQUIRE_SONAR_QUALITY_GATE"

  dependencies:
    name: Dependency vulnerabilities
    # GitHub cannot read this build's dependencies from its files, so Dependabot alerts see none
    # of them until the resolved graph is submitted. Fork pull requests get a read-only token,
    # which cannot submit, so they are left out. Deliberately not needed by the release: a newly
    # disclosed vulnerability must not block shipping an unrelated fix.
    if: >-
      github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To submit the dependency graph.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, and the build below runs third-party code.
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Fails on a vulnerable runtime dependency that the pull request adds or changes. What is
      # disclosed later about a dependency already on main arrives as a Dependabot alert instead.
      - name: Review the dependencies the pull request changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: false
          # The graph submitted above takes a moment to become available.
          retry-on-snapshot-warnings: true

  pr-summary:
    name: Summarise the run on the pull request
    # One comment per pull request, replaced on every run. Runs when earlier jobs failed, which
    # is when it matters, but not when the run was cancelled. Fork pull requests get a read-only
    # token, so they are left out.
    needs: [jar, test, e2e, image, smoke, smoke-bluetooth, sonar, dependencies]
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To read this run's start time and the links to its jobs.
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Nothing here pushes, and the steps below run third-party code.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/pr-summary/package-lock.json

      # Either artifact is missing when its job failed before running any test.
      - name: Download the unit and integration results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-test
          path: junit/test

      - name: Download the browser test results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: junit-e2e
          path: junit/e2e

      # The only step here that may fail the job: a broken summary script should fail the
      # pull request that broke it. Everything after it reports problems as warnings.
      - name: Test the summary script
        working-directory: scripts/pr-summary
        run: |
          npm ci --ignore-scripts
          npm test

      # Kept apart from the step below, so that the script and its dependency never see the
      # token. Without these values the summary only loses its duration and its job log links.
      - name: Read the run's start time and jobs
        id: run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          started_at=$(gh api "$run" --jq .run_started_at) || started_at=
          jobs=$(gh api "$run/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '[.jobs[] | {name, html_url, conclusion}] | tojson') || jobs='[]'
          {
            echo "started_at=$started_at"
            echo "jobs=$jobs"
          } >> "$GITHUB_OUTPUT"

      - name: Write the summary
        id: summary
        continue-on-error: true
        working-directory: scripts/pr-summary
        env:
          # Passed as environment variables rather than interpolated into the script.
          NEEDS_JSON: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_STARTED_AT: ${{ steps.run.outputs.started_at }}
          JOBS_JSON: ${{ steps.run.outputs.jobs }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Yukuhu_home-control
          JUNIT_TEST_DIR: ${{ github.workspace }}/junit/test
          JUNIT_E2E_DIR: ${{ github.workspace }}/junit/e2e
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          if ! npm run --silent summary; then
            echo "::warning::The pull request summary could not be written."
            exit 1
          fi

      # Delete before posting: if posting fails, the pull request has no summary rather than
      # two. Only this workflow's own comments are deleted, so pasting the marker into a
      # comment does not get that comment removed.
      - name: Replace the comment on the pull request
        if: steps.summary.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          set -euo pipefail
          trap 'echo "::warning::The pull request summary could not be posted."' ERR
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          gh api --paginate "$comments?per_page=100" --jq '.[]
            | select(.user.login == "github-actions[bot]")
            | select(.body | startswith("<!-- home-control-ci-summary -->"))
            | .id' > "$RUNNER_TEMP/previous-summaries"
          while read -r id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          done < "$RUNNER_TEMP/previous-summaries"
          gh api --method POST "$comments" -F "body=@$SUMMARY_FILE" --silent

  release:
    name: Release
    # Publishes the images the smoke tests ran, under the release's tags. Nothing is built here,
    # so the only job that may write to the repository and the registry runs no build.
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.jar.outputs.release == 'true'
    needs: [jar, test, image, smoke, e2e, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the digests of the tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-image-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Download the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # metadata-action lowercases the image name, which GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.jar.outputs.version }}
            type=raw,value=${{ needs.jar.outputs.majorminor }}
            type=raw,value=latest
            type=sha,format=long

      - name: Publish the tested images under the release's tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: scripts/publish-images.sh "$RUNNER_TEMP/digests" amd64,arm64

      # Tag and release after the image, so a failure above never leaves a tag pointing at an
      # image that was never pushed.
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.jar.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Report
        env:
          TAG: ${{ needs.jar.outputs.tag }}
        run: echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"

  release-bluetooth:
    name: Release the Bluetooth image
    # Same jar, plus mpv for Bluetooth speakers (docs/bluetooth-speakers.md). Its own job, after
    # the release is tagged: this optional variant must never gate or delay the release itself.
    # Runs only if the release happened and the variant passed its smoke tests.
    needs: [jar, release, smoke-bluetooth]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the digests of the tested images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-bluetooth-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-bluetooth
          tags: |
            type=raw,value=${{ needs.jar.outputs.version }}
            type=raw,value=${{ needs.jar.outputs.majorminor }}
            type=raw,value=latest

      - name: Publish the tested images under the release's tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: scripts/publish-images.sh "$RUNNER_TEMP/digests" amd64,arm64

